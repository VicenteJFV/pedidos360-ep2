# Perfil oracle: la conexion se define por variables de entorno, nunca aqui.
#
# ---------------------------------------------------------------------------
# EP2 - Oracle Autonomous Database en Oracle Cloud (lo que usa este proyecto)
# ---------------------------------------------------------------------------
# Base Always Free "pedidos360" en sa-santiago-1, con mTLS: la conexion exige el
# wallet descargado desde la consola de OCI, ademas de la contrasena de ADMIN.
#
#   TNS_ADMIN=C:/dev/pedidos360-ep2/wallet          (en la EC2: /opt/pedidos360/wallet)
#   ORACLE_JDBC_URL=jdbc:oracle:thin:@pedidos360_tp?TNS_ADMIN=C:/dev/pedidos360-ep2/wallet
#   ORACLE_USER=ADMIN
#   ORACLE_PASSWORD=...
#
# pedidos360_tp es uno de los alias de tnsnames.ora dentro del wallet. Se usa _tp
# y no _high porque esta es una carga transaccional -muchas consultas cortas y
# concurrentes-, que es para lo que existe ese servicio. _high y _medium estan
# pensados para reportes pesados y admiten muy pocas sesiones simultaneas.
#
# El wallet trae cwallet.sso, de apertura automatica: en ejecucion no hace
# falta la contrasena del wallet, solo la de ADMIN. Para abrirlo el driver
# necesita oraclepki, que esta en el pom.
#
# El wallet NUNCA va al repositorio: la carpeta wallet/ esta en el .gitignore.
#
# ---------------------------------------------------------------------------
# EP1 - Oracle en Amazon RDS (eliminada el 15 de octubre de 2026)
# ---------------------------------------------------------------------------
# Vivia en la VPC, sin wallet. Se elimino por costo: detenida seguia cobrando y
# AWS la volvia a encender sola a los 7 dias.
#
#   ORACLE_JDBC_URL=jdbc:oracle:thin:@//<endpoint>.rds.amazonaws.com:1521/PEDIDOS

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# 30 s y no menos: la base esta en Santiago y la primera conexion incluye el
# apreton de manos mTLS. Desde la EC2 en Virginia cada viaje suma latencia.
spring.datasource.hikari.connection-timeout=30000

# 'update' deja que Hibernate cree las tablas y secuencias en el primer arranque.
# En un sistema real esto se reemplaza por scripts versionados (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
