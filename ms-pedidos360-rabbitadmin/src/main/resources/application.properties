spring.application.name=ms-pedidos360-rabbitadmin

# Puerto interno del microservicio administrador. Va detras del API Gateway
# igual que los demas, para que la administracion tampoco quede expuesta.
server.port=8084
server.address=${MS_BIND_ADDRESS:127.0.0.1}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Conexion al cluster
# ---------------------------------------------------------------------------
# Los dos endpoints del cluster: la administracion tiene que seguir funcionando
# cuando uno de los nodos se cae, que es justo cuando mas falta hace.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# Este microservicio no declara topologia al arrancar: solo la que le pidan por
# la API. Sin esto, el RabbitAdmin que autoconfigura Spring Boot declararia al
# conectarse cualquier Queue, Exchange o Binding que hubiera en el contexto.
spring.rabbitmq.dynamic=false

spring.jackson.default-property-inclusion=non_null

logging.level.cl.duoc.pedidos360=INFO
