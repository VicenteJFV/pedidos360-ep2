spring.application.name=ms-pedidos360-orders

# Puerto interno del microservicio principal.
server.port=8081

# SEGURIDAD DE RED: escucha SOLO en loopback por defecto. Ver comentario equivalente
# en el catalogo. En Docker con red bridge: MS_BIND_ADDRESS=0.0.0.0 y sin -p.
server.address=${MS_BIND_ADDRESS:127.0.0.1}

spring.profiles.active=${SPRING_PROFILE:dev}

# Destino del microservicio de catalogo. En EC2 ambos corren en la misma instancia.
catalog.base-url=${CATALOG_BASE_URL:http://localhost:8082}
catalog.connect-timeout=5s
catalog.read-timeout=10s

spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.cl.duoc.pedidos360=INFO
# ---------------------------------------------------------------------------
# RabbitMQ (EP2)
# ---------------------------------------------------------------------------
# Se declaran los dos endpoints del cluster y no un host unico: asi Spring sabe
# a quien reconectarse cuando el nodo que estaba usando deja de responder. Con
# spring.rabbitmq.host solo habria un destino posible y la caida de ese nodo
# dejaria al productor sin broker, aunque el otro siguiera en pie.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# Confirmaciones del broker. Sin esto, convertAndSend devuelve de inmediato y
# un mensaje perdido antes de llegar al broker pasaria inadvertido: el log diria
# "publicado" sin que nadie lo haya recibido.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Deja rastro en el log de cada publicacion con exchange, routing key y eventId.
logging.level.cl.duoc.pedidos360.orders.messaging=INFO
