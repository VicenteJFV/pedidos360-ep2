# Despliegue de EP2 en la EC2: toda la solucion en una sola red de Docker, como
# exige la guia -"El Frontend Angular, BFF y microservicios deberan estar
# desplegados en EC2" con Docker Compose-:
#
#   frontend     Angular servido por nginx               :80    publico
#   bff          BFF de EP1, ahora en contenedor          :8080  publico
#   orders, catalog, notify, rabbitadmin                  127.0.0.1 solamente
#   rabbitmq-1, rabbitmq-2  cluster de dos nodos          Management publico
#
# Que es publico y por que:
#
#   80 y 8080   El navegador no entra directo: pasa por el API Gateway, que
#               reenvia /app/... al frontend y /api/... al BFF. El API Gateway
#               los alcanza desde Internet, asi que el Security Group los abre.
#               El API Gateway aporta el HTTPS que Entra ID exige.
#   15672/3     RabbitMQ Management, publicado como en las guias del curso
#               ("15672:15672" y "15673:15672"). Lo protege su propio login,
#               con un usuario generado al desplegar: no existe guest/guest.
#   el resto    Microservicios y API administradora solo en 127.0.0.1 de la
#               EC2. Se usan por tunel SSH (aws/08-tunel-demo.ps1).
#
# Archivos que este Compose espera y que NO estan en git, porque los genera
# aws/07-desplegar-ep2.ps1 directamente en la EC2:
#
#   despliegue/.env              cookie de Erlang del cluster (RABBITMQ_COOKIE)
#                                y credenciales de RabbitMQ (RABBITMQ_USER/PASS)
#   despliegue/oracle.env        ORACLE_USER y ORACLE_PASSWORD
#   despliegue/rabbitmq-usuario.conf   usuario por defecto del broker
#   wallet/                      wallet de la Autonomous Database
#
# Las imagenes de los microservicios se construyen antes con docker build
# (ver despliegue/instalar-en-ec2.sh) y aqui solo se referencian por nombre.

name: pedidos360

x-rabbitmq-comun: &rabbitmq-comun
  image: rabbitmq:4.2.9-management
  restart: unless-stopped
  environment:
    # RABBITMQ_ERLANG_COOKIE no sirve en RabbitMQ 4.x: la cookie se fija por los
    # argumentos de Erlang, del servidor y de rabbitmqctl. Aqui viene de .env y
    # no de un valor escrito en git, como en el cluster de desarrollo.
    RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie ${RABBITMQ_COOKIE:?falta RABBITMQ_COOKIE en despliegue/.env}"
    RABBITMQ_CTL_ERL_ARGS: "-setcookie ${RABBITMQ_COOKIE}"
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 10s
    retries: 12
  networks: [pedidos360]

x-microservicio: &microservicio
  restart: unless-stopped
  networks: [pedidos360]
  environment: &entorno-comun
    # Escuchar en todas las interfaces DEL CONTENEDOR: si escuchara en su
    # loopback, la publicacion de puertos no le llegaria. Lo que limita el
    # acceso es el 127.0.0.1 de la seccion ports, que es el loopback del host.
    MS_BIND_ADDRESS: 0.0.0.0
    RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
    RABBITMQ_USER: ${RABBITMQ_USER:?falta RABBITMQ_USER en despliegue/.env}
    RABBITMQ_PASS: ${RABBITMQ_PASS:?falta RABBITMQ_PASS en despliegue/.env}
    # La EC2 tiene 4 GB para cinco JVM -estas cuatro y el BFF- y dos nodos de
    # RabbitMQ. Sin techo, cada JVM reserva un cuarto de la memoria del host y
    # entre todas lo agotan. SerialGC gasta menos memoria que G1 y estos
    # servicios no la necesitan.
    JAVA_OPTS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC

services:

  rabbitmq-1:
    <<: *rabbitmq-comun
    hostname: rabbitmq-1
    container_name: rabbitmq-1
    volumes:
      - ../rabbitmq-cluster/rabbitmq-1/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-usuario.conf:/etc/rabbitmq/conf.d/20-usuario.conf:ro
      - rabbitmq1_data:/var/lib/rabbitmq
    ports:
      # Como en las guias: en todas las interfaces. Ver el encabezado.
      - "15672:15672"

  rabbitmq-2:
    <<: *rabbitmq-comun
    hostname: rabbitmq-2
    container_name: rabbitmq-2
    volumes:
      - ../rabbitmq-cluster/rabbitmq-2/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-usuario.conf:/etc/rabbitmq/conf.d/20-usuario.conf:ro
      - rabbitmq2_data:/var/lib/rabbitmq
    ports:
      - "15673:15672"

  catalog:
    <<: *microservicio
    image: pedidos360/catalog:ep2
    container_name: ms-pedidos360-catalog
    env_file: oracle.env
    environment:
      <<: *entorno-comun
      SPRING_PROFILE: oracle
      TNS_ADMIN: /app/wallet
      ORACLE_JDBC_URL: jdbc:oracle:thin:@pedidos360_tp?TNS_ADMIN=/app/wallet
    volumes:
      - ../wallet:/app/wallet:ro
    ports:
      - "127.0.0.1:8082:8082"

  orders:
    <<: *microservicio
    image: pedidos360/orders:ep2
    container_name: ms-pedidos360-orders
    env_file: oracle.env
    environment:
      <<: *entorno-comun
      SPRING_PROFILE: oracle
      TNS_ADMIN: /app/wallet
      ORACLE_JDBC_URL: jdbc:oracle:thin:@pedidos360_tp?TNS_ADMIN=/app/wallet
      CATALOG_BASE_URL: http://catalog:8082
    volumes:
      - ../wallet:/app/wallet:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      rabbitmq-1: { condition: service_healthy }
      catalog: { condition: service_started }

  notify:
    <<: *microservicio
    image: pedidos360/notify:ep2
    container_name: ms-pedidos360-notify
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      rabbitmq-1: { condition: service_healthy }

  rabbitadmin:
    <<: *microservicio
    image: pedidos360/rabbitadmin:ep2
    container_name: ms-pedidos360-rabbitadmin
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      rabbitmq-1: { condition: service_healthy }

  bff:
    image: pedidos360/bff:ep2
    container_name: bff-pedidos360
    restart: unless-stopped
    networks: [pedidos360]
    environment:
      # Dentro de la red de Docker pedidos y catalogo se llaman por su nombre de
      # servicio. En EP1 eran 127.0.0.1 porque todo corria en el host.
      MICROSERVICIOS_ORDERS_BASEURL: http://orders:8081
      MICROSERVICIOS_CATALOG_BASEURL: http://catalog:8082
      # La API administradora de RabbitMQ entra por el BFF, solo para Admin.
      MICROSERVICIOS_RABBITADMIN_BASEURL: http://rabbitadmin:8084
      # Sin configuracion de CORS: se resuelve en el API Gateway.
      JAVA_OPTS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC
    ports:
      # Publico: es el destino del API Gateway, que lo alcanza desde Internet.
      # Era asi tambien en EP1.
      - "8080:8080"
    depends_on:
      orders: { condition: service_started }
      catalog: { condition: service_started }
      rabbitadmin: { condition: service_started }

  frontend:
    image: pedidos360/frontend:ep2
    container_name: frontend-pedidos360
    restart: unless-stopped
    networks: [pedidos360]
    ports:
      # Publico, por la misma razon que el BFF: el API Gateway reenvia aqui las
      # peticiones a /app/... y es quien da el HTTPS.
      - "80:80"

networks:
  pedidos360:

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
