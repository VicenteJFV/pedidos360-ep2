# Cluster RabbitMQ de dos nodos para EP2 - Pedidos360
#
# Los dos nodos comparten la misma Erlang Cookie, que es lo que les permite
# autenticarse entre si y formar un cluster. Cada uno publica sus puertos en el
# host con un desplazamiento para no colisionar:
#
#   rabbitmq-1  AMQP 5672   Management 15672
#   rabbitmq-2  AMQP 5673   Management 15673
#
# Spring Boot se conecta a ambos mediante spring.rabbitmq.addresses, de modo que
# si un nodo cae establece una conexion nueva con el otro.

services:
  rabbitmq-1:
    image: rabbitmq:4.2.9-management
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # RABBITMQ_ERLANG_COOKIE quedo obsoleta: RabbitMQ 4.x la ignora y cada nodo
      # genera una cookie aleatoria, con lo que join_cluster falla con
      # {:erpc, :noconnection}. La cookie se fija por los argumentos de Erlang,
      # tanto del servidor como de rabbitmqctl, que tambien la necesita.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie rabbitmq-cluster-cookie"
      RABBITMQ_CTL_ERL_ARGS: "-setcookie rabbitmq-cluster-cookie"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./rabbitmq-1/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - rabbitmq-net

  rabbitmq-2:
    image: rabbitmq:4.2.9-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      # RABBITMQ_ERLANG_COOKIE quedo obsoleta: RabbitMQ 4.x la ignora y cada nodo
      # genera una cookie aleatoria, con lo que join_cluster falla con
      # {:erpc, :noconnection}. La cookie se fija por los argumentos de Erlang,
      # tanto del servidor como de rabbitmqctl, que tambien la necesita.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie rabbitmq-cluster-cookie"
      RABBITMQ_CTL_ERL_ARGS: "-setcookie rabbitmq-cluster-cookie"
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./rabbitmq-2/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - rabbitmq-net
    depends_on:
      - rabbitmq-1

volumes:
  rabbitmq1_data:
  rabbitmq2_data:

networks:
  rabbitmq-net:
    driver: bridge
