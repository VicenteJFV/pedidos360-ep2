# Descubrimiento de nodos por configuracion estatica: cada nodo conoce de
# antemano a los dos miembros del cluster. Es el metodo que corresponde cuando
# la topologia es fija y conocida, como en este caso de dos nodos.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Intervalo de limpieza de nodos ausentes, en milisegundos. Debe ser entero.
cluster_formation.node_cleanup.interval = 10000
