# Sirve el frontend compilado bajo /app/.
#
# El navegador no llega aqui directo sino por el API Gateway: la ruta
# GET /app/{proxy+} del stage Desarrollo reenvia https://.../Desarrollo/app/x
# como http://<ec2>/app/x. Por eso la aplicacion vive en /app/ y su base href es
# /Desarrollo/app/: lo que el navegador ve es la URL del API Gateway.

server {
    listen 80;
    server_name _;

    # Nunca construir redirecciones con el Host de la EC2: sacarian al navegador
    # del API Gateway, y por ende de HTTPS.
    absolute_redirect off;

    location /app/ {
        root /usr/share/nginx/html;

        # Las rutas del router de Angular (/app/catalogo, /app/admin) no son
        # archivos: se responde index.html y Angular resuelve la vista.
        try_files $uri $uri/ /app/index.html;

        # index.html no se cachea, para que un despliegue nuevo se vea al
        # recargar. Los JS y CSS llevan un hash en el nombre y si se pueden
        # cachear: si cambian, cambia el nombre.
        location = /app/index.html {
            add_header Cache-Control "no-cache";
        }
    }

    location = /salud {
        default_type text/plain;
        return 200 "ok\n";
    }
}
