spring.application.name=ms-pedidos360-notify

# Puerto interno del consumidor. No expone API de negocio: solo /actuator/health,
# para poder comprobar que el proceso esta vivo sin mirar los logs.
server.port=8083
server.address=${MS_BIND_ADDRESS:127.0.0.1}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Conexion al cluster
# ---------------------------------------------------------------------------
# Los dos endpoints del cluster, no un host unico: cuando el nodo en uso deja de
# responder, Spring reconecta al otro sin intervencion.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# ---------------------------------------------------------------------------
# ACK manual + prefetch
# ---------------------------------------------------------------------------
# Con acknowledge-mode=manual el mensaje solo se da por procesado cuando el
# codigo llama a basicAck. En automatico, RabbitMQ lo borraria en cuanto lo
# entrega: si el consumidor se cayera a mitad del procesamiento, el trabajo se
# perderia sin dejar rastro.
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Un solo mensaje sin confirmar por consumidor. Es lo que permite ver en
# Management Ready=1 y Unacked=1 durante la demostracion, y evita que un
# consumidor acapare mensajes que otro podria estar procesando.
spring.rabbitmq.listener.simple.prefetch=1

# Un mensaje rechazado NO vuelve a la cola: se va al DLX. Si volviera, fallaria
# igual y quedaria en un ciclo infinito.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------------------------------------------------------------------------
# Reintentos con backoff exponencial
# ---------------------------------------------------------------------------
# El reintento del contenedor queda apagado a proposito. Es incompatible con la
# confirmacion manual: al agotar los reintentos deja el mensaje sin confirmar ni
# rechazar, colgado en Unacked, y con prefetch=1 detiene la cola completa. El
# detalle del por que esta en EjecutorDeConsumo, junto al codigo que lo
# reemplaza. Se comprobo contra el cluster antes de tomar esta decision.
spring.rabbitmq.listener.simple.retry.enabled=false

# Los reintentos los hace EjecutorDeConsumo con estos valores, que son los
# mismos de las guias: 3 reintentos esperando 1s, 2s y 4s. El backoff crece a
# proposito, porque si el proveedor esta saturado golpearlo cada 100 ms lo
# empeora. Agotados los reintentos, el mensaje se rechaza y termina en la DLQ.
notify.reintentos.maximo=3
notify.reintentos.espera-inicial=1s
notify.reintentos.multiplicador=2
notify.reintentos.espera-maxima=4s

logging.level.cl.duoc.pedidos360=INFO
